<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>Sign In</title>
   <link rel="stylesheet" href="ghana.css">
</head>
<body>             
  <div class="container">
    <!-- Left panel -->
    <div class="left-panel">
      <div class="text-content">
        <h1>Welcome,</h1>
        <p>Sign in to continue</p>
      </div>
    </div>

    <!-- Right panel -->
    <div class="right-panel">
      <button class="close-btn" aria-label="Close sign in form">
        <i class="fas fa-times text-sm"></i>
      </button>
      <form>
        <h2>SIGN IN</h2>
        <p>New here? <a href="#">Create an account</a></p>

        <input type="email" placeholder="" aria-label="" />
        <input type="password" placeholder="" aria-label="" />
        <a href="#">Forgot password?</a>

        <div class="captcha-box">
          <label>
            <input type="checkbox" id="reCAPTCHA"required />
            <span>I'm not a robot</span>
          </label>
          <img src="" alt="" />
        </div>

        <button class="submit-btn" type="submit">Sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
