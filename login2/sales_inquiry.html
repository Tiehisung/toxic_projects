<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salas Inquiry</title>
</head>
<style>

    body{
        background-color:rgb(66, 112, 66); 
        line-height: 1.6;
        color: #333;
        max-width: 600px;
        margin: auto;
        padding: 20px;

    }

    form{
        display: flex;
        flex-direction: column;
        gap: 15px;
        
    }
        



    .form-row {
        display: flex;
        gap: 15px;
     }

     .group {
        flex: 1;
        display: flex;
        flex-direction: column;

     }

     label {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 5px;
        color: #444;
     }
     
     label.required ::after{
        content: "*";
        color: #e74c3c;
     }

     input select{
        height: 36px;
        padding: 0 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
     }

     select{
        appearance: none;
        background-repeat: no-repeat;
        background-position: right 10px center;
        background-size: 15px;
        
     }


     pull{
        margin: 15px;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: rgba(67, 121, 221, 0.95);
        background-color: rgb(66, 112, 66);
        border: white;
        border-radius: 5px;
        border: white;
        width: 100%;
        max-width: 400px;
        padding: 20px;
    }
     .pull input{
        margin: 0;
        padding: 10px;
        width: 100%;
        border: 0;
        border-radius: 5px;
     }



</style>
<body>
    <form>

    <label><h3> with our  experts, sales & technical support</h3></label>

    <div class="form-row">
        <div class="group">
            <label for="First Name" class="required">First Name*</label>
            <input type="text" id="First Name" placeholder="First Name"> 
        </div>
    </div>



    <div class="form-row">
        <div class="hover1">
            <label for="Last Name" class="required">Last Name*</label>
            <input type="text" id="Last Name" placeholder="Last Name">
        </div>
    </div>



    <div class="form-row">
        <div class="group"> 
            <label for="Work Email" class="required">Work Email*</label>
            <input type="email" id="email" placeholder="example.@email.com">
        </div>
    </div>


    <div class="form-row">
        <div class="hover2">
            <label for="Work Phone" class="required">Work Phone*</label>
            <input type="tel" id=" Work Phone" placeholder="Work Phone">
        </div>
    </div>


    <div class="form-row">
        <div class="group">
            <label for="Company" class="required">Company*</label>
            <input type="text" id="Company" placeholder="Company">
        </div>
    </div>



    <div class="form-row">
        <div class="hover3">
            <label for="Job Title" class="required">Job Title*</label>
            <input type="text" id="Job Title" placeholder="Job Title">
        </div>
    </div>


    <div class="pull">
        <label for="Country" class="required">Country*</label>
        <input type="text" id="Country" placeholder="Country">
    </div>

    <div class="pull">
        <label for="Reason for Contact" class="required"> Reason for Contact*</label>
        <input type="text" id="Reason for Contact" placeholder="Reason for Contact">
    </div>
    </form>


</body>
</html>
